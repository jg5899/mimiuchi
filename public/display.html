<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimiuchi Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light {
            background-color: #ffffff;
            color: #333333;
        }

        body.dark {
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        body.light .header {
            background-color: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid #e0e0e0;
        }

        body.dark .header {
            background-color: rgba(26, 26, 26, 0.9);
            border-bottom: 1px solid #333333;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #999;
        }

        .status-indicator.connected {
            background-color: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }

        .status-indicator.disconnected {
            background-color: #f44336;
        }

        .theme-toggle {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        body.light .theme-toggle {
            background-color: #333333;
            color: #ffffff;
        }

        body.dark .theme-toggle {
            background-color: #ffffff;
            color: #333333;
        }

        .theme-toggle:hover {
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 2rem 2rem;
        }

        .transcription-list {
            font-size: 1.5rem;
            line-height: 1.8;
            white-space: normal;
            word-wrap: break-word;
        }

        .transcription-segment {
            display: inline;
            animation: fadeInSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transcription-segment.interim {
            opacity: 0.65;
            font-style: italic;
            color: inherit;
            filter: brightness(0.9);
        }

        .transcription-segment.final {
            opacity: 1;
            font-weight: 400;
            animation: finalizeText 0.2s ease-out;
        }

        @keyframes finalizeText {
            0% {
                transform: scale(0.98);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            opacity: 0.6;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state-text {
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .container {
                padding: 5rem 1rem 1rem;
            }

            .transcription-original {
                font-size: 1.1rem;
            }

            .transcription-translation {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body class="dark">
    <div class="header">
        <h1>Mimiuchi Display</h1>
        <div class="controls">
            <div class="status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <button class="theme-toggle" id="themeToggle">Toggle Theme</button>
        </div>
    </div>

    <div class="container">
        <div class="transcription-list" id="transcriptionList">
            <div class="empty-state">
                <div class="empty-state-icon">🎤</div>
                <div class="empty-state-text">Waiting for transcriptions...</div>
            </div>
        </div>
    </div>

    <script>
        // Language mapping from friendly names to language codes
        const languageMap = {
            'spanish': 'spa_Latn',
            'ukrainian': 'ukr_Cyrl',
            'russian': 'rus_Cyrl',
            'portuguese': 'por_Latn',
            'french': 'fra_Latn',
            'korean': 'kor_Hang',
            'mandarin': 'zho_Hans',
            'tagalog': 'tgl_Latn',
            'vietnamese': 'vie_Latn',
            'arabic': 'arb_Arab',
            'hindi': 'hin_Deva',
            'polish': 'pol_Latn',
            'romanian': 'ron_Latn'
        };

        // Language display names
        const languageNames = {
            'spa_Latn': 'Spanish',
            'ukr_Cyrl': 'Ukrainian',
            'rus_Cyrl': 'Russian',
            'por_Latn': 'Portuguese',
            'fra_Latn': 'French',
            'kor_Hang': 'Korean',
            'zho_Hans': 'Mandarin Chinese',
            'tgl_Latn': 'Tagalog',
            'vie_Latn': 'Vietnamese',
            'arb_Arab': 'Arabic',
            'hin_Deva': 'Hindi',
            'pol_Latn': 'Polish',
            'ron_Latn': 'Romanian'
        };

        // Get port and language from query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const port = urlParams.get('port') || window.location.port || '8080';
        const langParam = urlParams.get('lang');
        const targetLang = langParam ? languageMap[langParam.toLowerCase()] : null;
        // Use window.location.hostname to connect to the same host that served this page
        // This ensures it works both locally (localhost) and remotely (192.168.x.x)
        const wsUrl = `ws://${window.location.hostname}:${port}`;

        let ws = null;
        let reconnectInterval = null;
        const transcriptions = [];

        // Update page title if language is specified
        if (targetLang) {
            const langName = languageNames[targetLang] || langParam;
            document.title = `Mimiuchi Display - ${langName}`;
            document.querySelector('.header h1').textContent = `Mimiuchi Display - ${langName}`;
            console.log('[Display] Configured for language:', langName, '(', targetLang, ')');
        } else {
            console.log('[Display] No language filter - showing all messages');
        }

        // Theme management
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.className = savedTheme;

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.body.className;
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.className = newTheme;
            localStorage.setItem('theme', newTheme);
        });

        // WebSocket connection
        function connect() {
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('Connected to Mimiuchi');
                    updateStatus(true);

                    // Send subscription message if language is specified
                    if (targetLang) {
                        const subscribeMessage = JSON.stringify({
                            type: 'subscribe',
                            targetLang: targetLang
                        });
                        ws.send(subscribeMessage);
                        console.log(`Subscribed to language: ${targetLang}`);
                    }

                    if (reconnectInterval) {
                        clearInterval(reconnectInterval);
                        reconnectInterval = null;
                    }
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (error) {
                        console.error('Error parsing message:', error);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };

                ws.onclose = () => {
                    console.log('Disconnected from Mimiuchi');
                    updateStatus(false);
                    // Attempt to reconnect
                    if (!reconnectInterval) {
                        reconnectInterval = setInterval(connect, 3000);
                    }
                };
            } catch (error) {
                console.error('Connection error:', error);
                updateStatus(false);
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(connect, 3000);
                }
            }
        }

        function updateStatus(connected) {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusIndicator.className = 'status-indicator connected';
                statusText.textContent = 'Connected';
            } else {
                statusIndicator.className = 'status-indicator disconnected';
                statusText.textContent = 'Disconnected';
            }
        }

        function handleMessage(data) {
            console.log('[Display] Received message:', data);

            // Handle different message types
            if (data.type === 'text') {
                console.log('[Display] Processing text message:', {
                    hasTranscript: !!data.data?.transcript,
                    hasTranslation: !!data.data?.translation,
                    targetLang: data.data?.targetLang,
                    languageName: data.data?.languageName,
                    isFinal: data.data?.isFinal
                });
                updateTranscription(data.data);
            }
        }

        function updateTranscription(log) {
            const list = document.getElementById('transcriptionList');
            const MAX_TRANSCRIPTIONS = 50;

            // Remove empty state if it exists
            const emptyState = list.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
                console.log('[Display] Removed empty state, first message received');
            }

            // Skip if no transcript/translation content
            if (!log.transcript && !log.translation) {
                console.log('[Display] Skipping message with no content');
                return;
            }

            // Find or create transcription item
            let existingIndex = -1;
            if (!log.isFinal) {
                // Update the last interim transcription
                existingIndex = transcriptions.length - 1;
                if (existingIndex >= 0 && !transcriptions[existingIndex].isFinal) {
                    transcriptions[existingIndex] = log;
                    console.log('[Display] Updated interim transcription at index', existingIndex);
                } else {
                    transcriptions.push(log);
                    existingIndex = transcriptions.length - 1;
                    console.log('[Display] Added new interim transcription at index', existingIndex);
                }
            } else {
                // Add as final transcription
                existingIndex = transcriptions.length - 1;
                if (existingIndex >= 0 && !transcriptions[existingIndex].isFinal) {
                    transcriptions[existingIndex] = log;
                    console.log('[Display] Finalized interim transcription at index', existingIndex);
                } else {
                    transcriptions.push(log);
                    existingIndex = transcriptions.length - 1;
                    console.log('[Display] Added new final transcription at index', existingIndex);
                }
            }

            // Apply rolling window: keep only last MAX_TRANSCRIPTIONS entries
            if (transcriptions.length > MAX_TRANSCRIPTIONS) {
                const itemsToRemove = transcriptions.length - MAX_TRANSCRIPTIONS;
                transcriptions.splice(0, itemsToRemove);
                console.log('[Display] Trimmed transcriptions array, removed', itemsToRemove, 'old entries');

                // Adjust lastRenderedCount instead of resetting to prevent full re-render
                lastRenderedCount = Math.max(0, lastRenderedCount - itemsToRemove);

                // Remove corresponding DOM elements from the beginning
                const list = document.getElementById('transcriptionList');
                for (let i = 0; i < itemsToRemove && list.children.length > 0; i++) {
                    // Remove both the span element and the preceding text node (space)
                    if (list.children.length > 0) {
                        list.removeChild(list.firstChild);
                        // Also remove the space text node if it exists
                        if (list.firstChild && list.firstChild.nodeType === Node.TEXT_NODE) {
                            list.removeChild(list.firstChild);
                        }
                    }
                }
            }

            // Render all transcriptions
            renderTranscriptions();
        }

        let lastRenderedCount = 0;

        function renderTranscriptions() {
            const list = document.getElementById('transcriptionList');

            // Only append NEW items instead of rebuilding everything (prevents blinking)
            // Show translation if available, otherwise show transcript (fallback for when translations fail/pending)
            const validTranscriptions = transcriptions.filter(log => log.translation || log.transcript);

            // If we reset lastRenderedCount (due to trimming), rebuild the entire DOM
            if (lastRenderedCount === 0 && validTranscriptions.length > 0) {
                // Clear all existing DOM elements
                list.innerHTML = '';

                // Render all valid transcriptions
                for (let i = 0; i < validTranscriptions.length; i++) {
                    const log = validTranscriptions[i];

                    const segment = document.createElement('span');
                    segment.className = `transcription-segment ${log.isFinal ? 'final' : 'interim'}`;
                    // Show translation if available, otherwise show transcript as fallback
                    segment.textContent = log.translation || log.transcript;

                    // Add space before segment (except first one)
                    if (i > 0) {
                        list.appendChild(document.createTextNode(' '));
                    }

                    list.appendChild(segment);
                }

                lastRenderedCount = validTranscriptions.length;

                // Auto-scroll to bottom to show newest text
                requestAnimationFrame(() => {
                    window.scrollTo({
                        top: document.body.scrollHeight,
                        behavior: 'smooth'
                    });
                });
            }
            // Check if we have new items to add
            else if (validTranscriptions.length > lastRenderedCount) {
                // Append only the new items
                for (let i = lastRenderedCount; i < validTranscriptions.length; i++) {
                    const log = validTranscriptions[i];

                    const segment = document.createElement('span');
                    segment.className = `transcription-segment ${log.isFinal ? 'final' : 'interim'}`;
                    // Show translation if available, otherwise show transcript as fallback
                    segment.textContent = log.translation || log.transcript;

                    // Add space before segment (except first one)
                    if (list.children.length > 0) {
                        list.appendChild(document.createTextNode(' '));
                    }

                    list.appendChild(segment);
                }

                lastRenderedCount = validTranscriptions.length;

                // Auto-scroll to bottom to show newest text
                requestAnimationFrame(() => {
                    window.scrollTo({
                        top: document.body.scrollHeight,
                        behavior: 'smooth'
                    });
                });
            }
        }

        // Initialize connection
        connect();
    </script>
</body>
</html>
